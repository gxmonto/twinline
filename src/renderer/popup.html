<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:;">
  <title>Incoming call</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="grip" title="Drag to move — TwinLine remembers where you put this">
    <span class="logo" aria-hidden="true"></span>
    <span class="title">Incoming call</span>
    <span class="hint">drag to move</span>
    <button class="dismiss" id="btnDismiss" title="Hide this popup (the call keeps ringing in TwinLine)" aria-label="Hide">&#10005;</button>
  </header>
  <main id="calls"></main>
  <script type="module" src="popup.js"></script>
</body>
</html>
