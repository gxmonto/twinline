# Continuous integration: every push and pull request runs the test suite and
# boots the real app headlessly. Installers are only produced by release.yml.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Dependency currency: anything that ships must be clean (hard failure);
      # the build toolchain is audited too, as a warning that shows on the run.
      - name: Audit shipped dependencies
        run: npm audit --omit=dev
      - name: Audit build toolchain
        run: npm audit || echo "::warning title=Build toolchain advisories::npm audit found advisories in the dev dependency tree. Run 'npm audit' locally and bump the toolchain."
      - run: npm test
      # The smoke test boots a real Electron window, so it needs a display.
      # --no-sandbox: the SUID sandbox helper cannot be made setuid on a hosted runner.
      - run: xvfb-run --auto-servernum npx electron . --smoke --no-sandbox

  build-check:
    # Prove the packaging still works on both platforms without publishing.
    needs: test
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx electron-builder --publish never
      # Boot the AppImage that was just built: the 1.4.2 audit's H1 was in the
      # AppImage runtime, so the packaged Linux artefact itself must start.
      # (No FUSE on the runner, hence extract-and-run.)
      - name: Boot the AppImage
        if: runner.os == 'Linux'
        env: { APPIMAGE_EXTRACT_AND_RUN: '1' }
        run: xvfb-run --auto-servernum dist/*/TwinLine-*.AppImage --smoke --no-sandbox
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-packages
          path: |
            dist/*/*.exe
            dist/*/*.deb
            dist/*/*.rpm
            dist/*/*.AppImage
          retention-days: 7
